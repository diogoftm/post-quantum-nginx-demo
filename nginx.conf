events {}

http {
    server {
        listen 443 ssl;

        ssl_certificate     /opt/nginx/conf/certs/server.crt;
        ssl_certificate_key /opt/nginx/conf/certs/server.key;

        ssl_protocols TLSv1.3;

        # Hybrid PQ key exchange
        ssl_conf_command Groups X25519MLKEM768;

        location / {
            return 200 "PQ nginx working\n";
        }
    }
}
